# Manager for Realtek radio A (radio_a.cfg) — pairs with bw_b.cfg.
# Pair 1 (b2/a1): A->B send. Pair 2 (c3/d4): B->A receive.
# Upstream ports match esp32/bw_{a,b}.cfg so the same iperf/bw_test ports work.
# Console/inject/forward ports match radio_a.cfg. winject.power must be equal on
# both managers: the driver power override is global to the host.

winject.device        = 127.0.0.1
winject.console       = 2201
winject.channel       = 1
# Channel 1-14; channel 14 is 802.11b (DSSS/CCK) only.
winject.modulation    = OFDM_24M
winject.power         = 2
winject.domain        = 1234
winject.max_rate_kbps = 80000
winject.stats_sec     = 1
winject.skip_console  = 0
winject.radio_fcs     = actual
winject.forward_port  = 9210
winject.inject_port   = 9000

upstream.size = 2

upstream-0.mode             = UDP_SERVER_FORWARDING
upstream-0.tx_bus           = b2
upstream-0.rx_bus           = a1
upstream-0.scheduler_budget = 65536
upstream-0.bind_address     = 127.0.0.1:29000

upstream-1.mode             = UDP_CLIENT_FORWARDING
upstream-1.tx_bus           = c3
upstream-1.rx_bus           = d4
upstream-1.scheduler_budget = 65536
upstream-1.connect_address  = 127.0.0.1:9001
