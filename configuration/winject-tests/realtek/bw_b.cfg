# Manager for Realtek radio B (radio_b.cfg) — pairs with bw_a.cfg.
# Console/inject/forward ports match radio_b.cfg; 9001/9002 are taken by the
# iperf/bw_test listeners, hence 9003/9213.

radio.device        = 127.0.0.1
radio.console       = 2202
radio.channel       = 1
# Channel 1-14; channel 14 is 802.11b (DSSS/CCK) only.
radio.modulation    = OFDM_24M
radio.power         = 2
winject.domain        = 1234
winject.stats_sec     = 1
radio.skip_console  = 0
radio.fcs     = actual
radio.dplane_port   = 9003

upstream.size = 2

upstream-0.mode             = UDP_CLIENT_FORWARDING
upstream-0.tx_bus           = a1
upstream-0.rx_bus           = b2
upstream-0.scheduler_budget = 65536
upstream-0.connect_address  = 127.0.0.1:9002

upstream-1.mode             = UDP_SERVER_FORWARDING
upstream-1.tx_bus           = d4
upstream-1.rx_bus           = c3
upstream-1.scheduler_budget = 65536
upstream-1.bind_address     = 127.0.0.1:29001
