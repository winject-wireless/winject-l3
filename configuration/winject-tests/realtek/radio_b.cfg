# winject-radio-realtek, radio B (started by scripts/realtek_radios.sh).
# radio.txpower is appended by the script: <winject-radio-realtek>/configuration/txpower.csv
radio.device     = wlx00c0cabce072
radio.driver     = rtl88xxau_wfb
radio.regdom     = BO
radio.bandwidth  = 20

net.bind         = 127.0.0.1
net.console_port = 2202
net.dplane_port  = 9003

state.dir        = /tmp/winject-radio-b

tune.tx_queue_sz = 20
log.level        = info
