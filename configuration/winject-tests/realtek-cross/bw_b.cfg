# Manager for Realtek radio B (remote host). Pairs with realtek-cross/bw_a.cfg.
# winject.device is overridden by manager_iperf_bw_test.sh (--b, remote LAN IP).
# Radio process: realtek/radio_b.cfg on the remote host (net.bind = 0.0.0.0).

winject.device        = 192.168.253.127
winject.console       = 2202
winject.channel       = 1
winject.modulation    = OFDM_24M
winject.power         = 2
winject.domain        = 1234
winject.max_rate_kbps = 80000
winject.stats_sec     = 1
winject.skip_console  = 0
winject.radio_fcs     = actual
winject.dplane_port   = 9003

upstream.size = 2

upstream-0.mode             = UDP_CLIENT_FORWARDING
upstream-0.tx_bus           = a1
upstream-0.rx_bus           = b2
upstream-0.scheduler_budget = 65536
upstream-0.connect_address  = 127.0.0.1:9002

upstream-1.mode             = UDP_SERVER_FORWARDING
upstream-1.tx_bus           = d4
upstream-1.rx_bus           = c3
upstream-1.scheduler_budget = 65536
upstream-1.bind_address     = 127.0.0.1:29001
