# Manager for Realtek radio B (remote host). Pairs with realtek-cross/bw_a.cfg.
# radio.mplane and radio.dplane hosts are overridden by manager_iperf_bw_test.sh (--b, remote LAN IP).
# Radio process: realtek/radio_b.cfg on the remote host (net.bind = 0.0.0.0).

radio.dplane        = 192.168.253.127:9003
radio.mplane        = 192.168.253.127:2202
radio.channel       = 1
radio.modulation    = OFDM_24M
radio.power         = 2
winject.domain        = 1234
winject.stats_sec     = 1
radio.fcs     = actual

upstream.size = 2

upstream-0.mode             = UDP_CLIENT_FORWARDING
upstream-0.tx_bus           = a1
upstream-0.rx_bus           = b2
upstream-0.scheduler_budget = 65536
upstream-0.tx               = 127.0.0.1:9002

upstream-1.mode             = UDP_SERVER_FORWARDING
upstream-1.tx_bus           = d4
upstream-1.rx_bus           = c3
upstream-1.scheduler_budget = 65536
upstream-1.rx               = 127.0.0.1:29001
