# Manager for Realtek radio A (local host). Pairs with realtek-cross/bw_b.cfg.
# winject.device is overridden by manager_iperf_bw_test.sh (--a, default 127.0.0.1).
# Radio process: configuration/winject-tests/realtek/radio_a.cfg on this host.

winject.device        = 127.0.0.1
winject.console       = 2201
winject.channel       = 1
winject.modulation    = OFDM_24M
winject.power         = 2
winject.domain        = 1234
winject.max_rate_kbps = 80000
winject.stats_sec     = 1
winject.skip_console  = 0
winject.radio_fcs     = actual
winject.dplane_port   = 9000

upstream.size = 2

upstream-0.mode             = UDP_SERVER_FORWARDING
upstream-0.tx_bus           = b2
upstream-0.rx_bus           = a1
upstream-0.scheduler_budget = 65536
upstream-0.bind_address     = 127.0.0.1:29000

upstream-1.mode             = UDP_CLIENT_FORWARDING
upstream-1.tx_bus           = c3
upstream-1.rx_bus           = d4
upstream-1.scheduler_budget = 65536
upstream-1.connect_address  = 127.0.0.1:9001
